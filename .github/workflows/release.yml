name: Framecut Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build
        required: true
        default: v3.6
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Tag und Versionsdatei prüfen
        shell: bash
        run: |
          test "${RELEASE_TAG}" = "v$(<VERSION)" || {
            echo "Tag ${RELEASE_TAG} passt nicht zu VERSION $(<VERSION)."
            exit 1
          }

      - name: Linux-Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libxcb-cursor0 libegl1 python3-venv zip dpkg

      - name: Python-Umgebung vorbereiten
        run: |
          python3 -m venv "$RUNNER_TEMP/framecut-venv"
          "$RUNNER_TEMP/framecut-venv/bin/python" -m pip install -r requirements.txt

      - name: Tests ausführen
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "$RUNNER_TEMP/framecut-venv/bin/python" -m unittest -q test_delivery.py test_core.py test_gui.py

      - name: Offizielles AppImage-Werkzeug laden
        run: |
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"

      - name: Release-Artefakte bauen
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
          FRAMECUT_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          ./build_release.sh "$RUNNER_TEMP/release"

      - name: GitHub Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber \
              "$RUNNER_TEMP/release"/*
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Framecut ${RELEASE_TAG}" \
              --generate-notes \
              "$RUNNER_TEMP/release"/*
          fi
